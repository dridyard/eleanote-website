<script>

   ================================================================ */
var DUR = 38.5;
var RENDER = /[?&]render/.test(location.search);
var FREEZE = (function(){ var m = location.search.match(/[?&]t=([\d.]+)/); return m ? parseFloat(m[1]) : null; })();

var E = {
  linear:  function(p){ return p; },
  outCubic:function(p){ return 1 - Math.pow(1 - p, 3); },
  inCubic: function(p){ return p * p * p; },
  inOut:   function(p){ return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2; },
  outQuint:function(p){ return 1 - Math.pow(1 - p, 5); },
  outBack: function(p){ var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
};
function kv(kfs, t) {
  if (t <= kfs[0][0]) return kfs[0][1];
  var last = kfs[kfs.length - 1];
  if (t >= last[0]) return last[1];
  for (var i = 1; i < kfs.length; i++) {
    if (t <= kfs[i][0]) {
      var a = kfs[i-1], b = kfs[i];
      var p = (t - a[0]) / (b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * E[b[2] || 'inOut'](p);
    }
  }
  return last[1];
}
var $ = function(id){ return document.getElementById(id); };

var BEATS = [
  ['b1', 0.0, 3.0], ['b2', 3.0, 6.0], ['b3', 6.0, 13.0], ['b4', 13.0, 15.8],

  ['b8a', 26.6, 29.2], ['b8b', 29.2, 32.2], ['b8c', 32.2, 34.4], ['b9', 34.4, 38.51]
];

var TRACKS = [

  { el:'b1l2', o:[[0.45,0],[0.78,1,'outCubic'],[2.65,1],[2.95,0,'inCubic']], y:[[0.45,64],[0.82,0,'outBack'],[2.65,0],[2.95,-44,'inCubic']] },

  /* B2 turn */
  { el:'b2pill', o:[[3.10,0],[3.45,1,'outCubic'],[5.65,1],[5.95,0,'inCubic']], y:[[3.10,-150],[3.55,0,'outBack'],[5.65,0],[5.95,-30,'inCubic']], s:[[3.10,0.75],[3.55,1,'outBack']] },

  { el:'b2l2', o:[[3.75,0],[4.10,1,'outCubic'],[5.65,1],[5.95,0,'inCubic']], y:[[3.75,54],[4.15,0,'outBack'],[5.65,0],[5.95,-40,'inCubic']] },
  /* B3 full-bleed transfer: stage fades in from cream, ring flash, chips */
  { el:'b3cam', o:[[6.05,0],[6.50,1,'linear'],[12.68,1],[13.0,0,'linear']] },
  { el:'spotRing', o:[[7.35,0],[7.65,1,'outCubic'],[9.35,1],[9.75,0,'inCubic']],
                   s:[[7.35,1.55],[7.80,1,'outBack'],[8.35,1],[8.60,1.07,'inOut'],[8.85,1,'inOut']] },

  { el:'b4l2', o:[[13.35,0],[13.70,1,'outCubic'],[15.45,1],[15.75,0,'inCubic']], y:[[13.35,44],[13.74,0,'outCubic'],[15.45,0],[15.75,-34,'inCubic']] },
  /* B6 tell it */
  { el:'b6l1', o:[[15.88,0],[16.22,1,'outCubic'],[18.25,1],[18.55,0,'inCubic']], y:[[15.88,54],[16.26,0,'outBack'],[18.25,0],[18.55,-40,'inCubic']] },
  { el:'b6l2', o:[[16.20,0],[16.55,1,'outCubic'],[18.25,1],[18.55,0,'inCubic']], y:[[16.20,58],[16.60,0,'outBack'],[18.25,0],[18.55,-40,'inCubic']], s:[[16.20,0.9],[16.65,1,'outBack']] },
  /* B7 feedback (v1 choreography shifted -4.4s) */
  { el:'b7cap', o:[[18.65,0],[19.00,1,'outCubic'],[26.22,1],[26.55,0,'inCubic']], y:[[18.65,40],[19.05,0,'outCubic'],[26.22,0],[26.55,-26,'inCubic']] },
  { el:'b7app', o:[[18.72,0],[19.12,1,'outCubic'],[26.22,1],[26.55,0,'inCubic']], y:[[18.72,66],[19.18,0,'outCubic'],[26.22,0],[26.55,-26,'inCubic']], s:[[18.72,0.97],[19.18,1,'outCubic'],[24.5,1],[25.0,1.006,'inOut']] },
  { el:'fbBtn', s:[[21.90,1],[22.06,0.93,'outCubic'],[22.22,1,'outBack']] },
  { el:'b7under', o:[[24.15,0],[24.55,1,'outCubic'],[26.22,1],[26.55,0,'inCubic']], y:[[24.15,42],[24.60,0,'outBack'],[26.22,0],[26.55,-26,'inCubic']] },
  /* B8a full-bleed prechart */
  { el:'b8acap', o:[[26.65,0],[27.00,1,'outCubic'],[28.92,1],[29.15,0,'inCubic']], x:[[26.65,-90],[27.05,0,'outCubic'],[28.92,0],[29.15,60,'inCubic']] },
  { el:'b8acam', o:[[26.65,0],[27.00,1,'linear'],[28.95,1],[29.2,0,'linear']] },
  /* B8b full-bleed orders */
  { el:'b8bcap', o:[[29.25,0],[29.60,1,'outCubic'],[31.92,1],[32.15,0,'inCubic']], x:[[29.25,90],[29.65,0,'outCubic'],[31.92,0],[32.15,-60,'inCubic']] },
  { el:'b8bcam', o:[[29.25,0],[29.60,1,'linear'],[31.95,1],[32.2,0,'linear']] },

  { el:'b8cl1', o:[[32.25,0],[32.58,1,'outCubic'],[34.05,1],[34.35,0,'inCubic']], s:[[32.25,0.88],[32.65,1,'outBack']] },
  { el:'b8cl2', o:[[32.50,0],[32.85,1,'outCubic'],[34.05,1],[34.35,0,'inCubic']], y:[[32.50,40],[32.90,0,'outBack']] },
  /* B9 CTA */
  { el:'b9pill', o:[[34.50,0],[34.90,1,'outCubic']], y:[[34.50,-70],[35.00,0,'outBack']] },
  { el:'b9word', o:[[34.72,0],[35.12,1,'outCubic']], s:[[34.72,0.955],[35.20,1,'outCubic']] },
  { el:'b9tag',  o:[[35.00,0],[35.40,1,'outCubic']], y:[[35.00,30],[35.45,0,'outCubic']] },
  { el:'b9free', o:[[35.28,0],[35.68,1,'outCubic']], y:[[35.28,26],[35.72,0,'outCubic']] },
  { el:'b9url',  o:[[35.50,0],[35.90,1,'outCubic']], s:[[35.50,0.85],[36.00,1,'outBack'],[36.60,1],[36.95,1.05,'inOut'],[37.35,1,'inOut']] }
];

/* Full-bleed cameras on the 420x607 phone stage. (px,py) is the stage
   point brought to canvas center; scale 2.58 ≈ edge-to-edge width. */
var CAMS = [
  { el:'b3cam', w:420, h:607, kfs:[
      [6.0, 2.58, 0.50, 0.44], [7.3, 2.58, 0.50, 0.44, 'linear'],
      [8.6, 4.80, 0.770, 0.175, 'inOut'], [9.7, 4.80, 0.770, 0.175, 'linear'],
      [10.9, 2.95, 0.55, 0.33, 'inOut'], [13.0, 2.66, 0.52, 0.40, 'linear'] ] },
  { el:'b8acam', w:420, h:607, kfs:[ [26.6, 2.58, 0.50, 0.44], [29.2, 3.05, 0.55, 0.36, 'linear'] ] },
  { el:'b8bcam', w:420, h:607, kfs:[ [29.2, 2.58, 0.50, 0.44], [30.4, 2.86, 0.51, 0.45, 'inOut'], [32.2, 2.92, 0.50, 0.43, 'linear'] ] }
];

/* Scene excerpts (PHONE variants). sceneStart = scene-local time at beat t0. */
var SCENES = [
  { beat:'b3',  rootSel:'#b3 .scenes-wrap',  t0:6.0,  t1:13.0, sceneStart:10.3 },
  { beat:'b8a', rootSel:'#b8a .scenes-wrap', t0:26.6, t1:29.2, sceneStart:3.3 },
  { beat:'b8b', rootSel:'#b8b .scenes-wrap', t0:29.2, t1:32.2, sceneStart:4.5 }
];
SCENES.forEach(function(sc){
  var root = document.querySelector(sc.rootSel);
  sc.els = [root].concat(Array.prototype.slice.call(root.querySelectorAll('*')));
});

var TYPE_TEXT = 'Make the assessment more concise';
function applySpecials(t) {
  $('fbInput').className = (t >= 19.55 && t < 26.2) ? 'fb-input focus' : 'fb-input';
  $('fbPh').style.opacity = t < 19.65 ? 1 : Math.max(0, 1 - (t - 19.65) / 0.15);
  var p = Math.min(1, Math.max(0, (t - 19.8) / 1.8));
  var want = TYPE_TEXT.slice(0, Math.floor(p * TYPE_TEXT.length));
  var typedEl = $('fbTyped');
  if (typedEl.textContent !== want) typedEl.textContent = want;
  var caretOn = (t >= 19.55 && t <= 22.3) && (Math.floor(t * 2.5) % 2 === 0);
  $('fbCaret').style.opacity = caretOn ? 1 : 0;
  var btn = $('fbBtn');
  var label = t < 22.1 ? 'Apply feedback' : (t < 23.6 ? 'Rewriting…' : 'Done ✓');
  if (btn.textContent !== label) btn.textContent = label;
  var wordy = $('fbWordy'), concise = $('fbConcise');
  wordy.style.maxHeight = kv([[22.5,300],[23.35,0,'inOut']], t) + 'px';
  wordy.style.opacity = kv([[22.5,1],[23.15,0,'linear']], t);
  concise.style.maxHeight = kv([[22.95,0],[23.55,110,'inOut']], t) + 'px';
  concise.style.opacity = kv([[23.05,0],[23.55,1,'linear']], t);
  var sh = $('fbShimmer');
  sh.style.opacity = kv([[22.4,0],[22.65,1,'linear'],[23.7,1],[24.05,0,'linear']], t);
  sh.style.backgroundPosition = kv([[22.45,140],[23.95,-140,'linear']], t) + '% 0';
}

function seek(t) {
  t = Math.max(0, Math.min(DUR, t));
  for (var i = 0; i < BEATS.length; i++) {
    var b = BEATS[i];
    document.getElementById(b[0]).style.visibility = (t >= b[1] && t < b[2]) ? 'visible' : 'hidden';
  }
  for (var j = 0; j < TRACKS.length; j++) {
    var tr = TRACKS[j];
    var el = tr._el || (tr._el = $(tr.el));
    if (!el) continue;
    if (tr.o) el.style.opacity = kv(tr.o, t);
    var parts = '';
    if (tr.x) parts += 'translateX(' + kv(tr.x, t) + 'px) ';
    if (tr.y) parts += 'translateY(' + kv(tr.y, t) + 'px) ';
    if (tr.s) parts += 'scale(' + kv(tr.s, t) + ') ';
    if (tr.r) parts += 'rotate(' + kv(tr.r, t) + 'deg) ';
    if (tr.ry) parts += 'rotateY(' + kv(tr.ry, t) + 'deg) ';
    if (parts) {
      /* the ring keeps its centering translate */
      if (tr.el === 'spotRing') parts = 'translate(-50%,-62%) ' + parts;
      /* chips keep their horizontal centering */
      if (tr.el === 'b3chipA' || tr.el === 'b3chipB') parts = 'translateX(-50%) ' + parts.replace('translateX(', 'translateY(0px) translateX(');
      el.style.transform = parts;
    }
  }
  for (var k = 0; k < CAMS.length; k++) {
    var c = CAMS[k];
    var el2 = c._el || (c._el = $(c.el));
    var s = kv(c.kfs.map(function(f){ return [f[0], f[1], f[4]]; }), t);
    var px = kv(c.kfs.map(function(f){ return [f[0], f[2], f[4]]; }), t);
    var py = kv(c.kfs.map(function(f){ return [f[0], f[3], f[4]]; }), t);
    var tx = (0.5 - px + 0.5 - 0.5) * c.w * s;
    tx = (0.5 - px) * c.w * s;
    var ty = (0.5 - py) * c.h * s + (c.dy || 0);
    el2.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
  }
  for (var m = 0; m < SCENES.length; m++) {
    var sc = SCENES[m];
    if (t < sc.t0 - 0.1 || t > sc.t1 + 0.1) continue;
    var local = Math.min(sc.t1 - sc.t0, Math.max(0, t - sc.t0)) + sc.sceneStart;
    var delay = (-local) + 's';
    for (var n = 0; n < sc.els.length; n++) {
      sc.els[n].style.animationDelay = delay;
      sc.els[n].style.animationPlayState = 'paused';
    }
  }
  applySpecials(t);
}

function measureTargets() {
  document.querySelectorAll('.stage').forEach(function(stage){
    var sr = stage.getBoundingClientRect();
    if (!sr.width || !sr.height) return;
    stage.querySelectorAll('[data-target]').forEach(function(el){
      var r = el.getBoundingClientRect();
      var px = ((r.left + r.width / 2 - sr.left) / sr.width) * 100;
      var py = ((r.top + r.height / 2 - sr.top) / sr.height) * 100;
      stage.style.setProperty('--' + el.dataset.target + '-x', px.toFixed(3) + '%');
      stage.style.setProperty('--' + el.dataset.target + '-y', py.toFixed(3) + '%');
    });
  });
}
function pauseAllScenes() {
  document.querySelectorAll('.scenes-wrap').forEach(function(root){
    [root].concat(Array.prototype.slice.call(root.querySelectorAll('*'))).forEach(function(el){
      el.style.animationPlayState = 'paused';
    });
  });
}
function fitPreview() {
  if (RENDER) return;
  var sc = Math.min(window.innerWidth / 1080, window.innerHeight / 1350) * 0.98;
  document.getElementById('canvas').style.transform = 'scale(' + sc + ')';
}

function boot() {
  if (RENDER) document.body.classList.add('render');
  /* the attention ring lives inside the phone stage so it can use the
     measured --pill-x/--pill-y coordinates */
  var b3stage = document.querySelector('#b3 .stage.p');
  if (b3stage && !document.getElementById('spotRing')) {
    var ring = document.createElement('div');
    ring.className = 'spot-ring';
    ring.id = 'spotRing';
    b3stage.appendChild(ring);
  }
  measureTargets();
  pauseAllScenes();
  seek(FREEZE != null ? FREEZE : 0);
  fitPreview();
  window.addEventListener('resize', function(){ fitPreview(); measureTargets(); });
  window.__ready = true;
  if (!RENDER && FREEZE == null) {
    var start = performance.now();
    (function loop(now){
      seek(((now - start) / 1000) % DUR);
      requestAnimationFrame(loop);
    })(start);
  }
}

window.__total = DUR;
window.__seek = function(t){ seek(t); };

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function(){ setTimeout(boot, 60); });
} else {
  window.addEventListener('load', function(){ setTimeout(boot, 120); });
}
