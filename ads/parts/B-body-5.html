<script>
/* ================================================================
   DETERMINISTIC TIMELINE ENGINE
   Everything on screen is a pure function of t (seconds).
   ================================================================ */
var DUR = 42.0;
var RENDER = /[?&]render/.test(location.search);
var FREEZE = (function(){ var m = location.search.match(/[?&]t=([\d.]+)/); return m ? parseFloat(m[1]) : null; })();

/* ---------------- easings ---------------- */
var E = {
  linear:  function(p){ return p; },
  outCubic:function(p){ return 1 - Math.pow(1 - p, 3); },
  inCubic: function(p){ return p * p * p; },
  inOut:   function(p){ return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2; },
  outQuint:function(p){ return 1 - Math.pow(1 - p, 5); },
  outBack: function(p){ var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
};

/* kfs = [[t, v, easeName?], ...] — easeName on a point eases the segment ARRIVING at it */
function kv(kfs, t) {
  if (t <= kfs[0][0]) return kfs[0][1];
  var last = kfs[kfs.length - 1];
  if (t >= last[0]) return last[1];
  for (var i = 1; i < kfs.length; i++) {
    if (t <= kfs[i][0]) {
      var a = kfs[i-1], b = kfs[i];
      var p = (t - a[0]) / (b[0] - a[0]);
      var ease = E[b[2] || 'inOut'];
      return a[1] + (b[1] - a[1]) * ease(p);
    }
  }
  return last[1];
}

var $ = function(id){ return document.getElementById(id); };

/* ---------------- beat windows ---------------- */
var BEATS = [
  ['b1', 0.0, 3.0], ['b2', 3.0, 6.0], ['b3', 6.0, 13.0], ['b4', 13.0, 16.0],
  ['b5', 16.0, 20.0], ['b6', 20.0, 23.0], ['b7', 23.0, 31.0],
  ['b8a', 31.0, 33.4], ['b8b', 33.4, 35.8], ['b8c', 35.8, 38.0], ['b9', 38.0, 42.01]
];

/* ---------------- element tracks (opacity / transform) ----------------
   {el, o?, x?, y?, s?, r?, ry?} — each a kfs list. */
var TRACKS = [
  /* B1 hook */
  { el:'b1l1', o:[[0.05,0],[0.38,1,'outCubic'],[2.65,1],[2.95,0,'inCubic']], y:[[0.05,64],[0.42,0,'outBack'],[2.65,0],[2.95,-44,'inCubic']] },
  { el:'b1l2', o:[[0.45,0],[0.78,1,'outCubic'],[2.65,1],[2.95,0,'inCubic']], y:[[0.45,64],[0.82,0,'outBack'],[2.65,0],[2.95,-44,'inCubic']] },
  { el:'b1l3', o:[[0.85,0],[1.18,1,'outCubic'],[2.65,1],[2.95,0,'inCubic']], y:[[0.85,64],[1.22,0,'outBack'],[2.65,0],[2.95,-44,'inCubic']] },
  { el:'b1cp', r:[[1.30,0],[1.39,-2.6,'linear'],[1.48,2.2,'linear'],[1.57,-1.7,'linear'],[1.66,1.1,'linear'],[1.75,0,'linear']],
               x:[[1.30,0],[1.39,-5,'linear'],[1.48,4,'linear'],[1.57,-3,'linear'],[1.66,2,'linear'],[1.75,0,'linear']] },

  /* B2 turn */
  { el:'b2pill', o:[[3.10,0],[3.45,1,'outCubic'],[5.65,1],[5.95,0,'inCubic']], y:[[3.10,-150],[3.55,0,'outBack'],[5.65,0],[5.95,-30,'inCubic']], s:[[3.10,0.75],[3.55,1,'outBack']] },
  { el:'b2l1', o:[[3.50,0],[3.85,1,'outCubic'],[5.65,1],[5.95,0,'inCubic']], y:[[3.50,54],[3.90,0,'outBack'],[5.65,0],[5.95,-40,'inCubic']] },
  { el:'b2l2', o:[[3.75,0],[4.10,1,'outCubic'],[5.65,1],[5.95,0,'inCubic']], y:[[3.75,54],[4.15,0,'outBack'],[5.65,0],[5.95,-40,'inCubic']] },

  /* B3 transfer */
  { el:'b3cap', o:[[6.05,0],[6.40,1,'outCubic'],[12.62,1],[12.95,0,'inCubic']], y:[[6.05,44],[6.45,0,'outCubic'],[12.62,0],[12.95,-30,'inCubic']] },

  { el:'b4l2', o:[[13.35,0],[13.70,1,'outCubic'],[15.65,1],[15.95,0,'inCubic']], y:[[13.35,44],[13.74,0,'outCubic'],[15.65,0],[15.95,-34,'inCubic']] },

  { el:'b6l1', o:[[20.08,0],[20.42,1,'outCubic'],[22.65,1],[22.95,0,'inCubic']], y:[[20.08,54],[20.46,0,'outBack'],[22.65,0],[22.95,-40,'inCubic']] },
  { el:'b6l2', o:[[20.40,0],[20.75,1,'outCubic'],[22.65,1],[22.95,0,'inCubic']], y:[[20.40,58],[20.80,0,'outBack'],[22.65,0],[22.95,-40,'inCubic']], s:[[20.40,0.9],[20.85,1,'outBack']] },

  /* B7 feedback */
  { el:'b7cap', o:[[23.05,0],[23.40,1,'outCubic'],[30.62,1],[30.95,0,'inCubic']], y:[[23.05,40],[23.45,0,'outCubic'],[30.62,0],[30.95,-26,'inCubic']] },
  { el:'b7app', o:[[23.12,0],[23.52,1,'outCubic'],[30.62,1],[30.95,0,'inCubic']], y:[[23.12,66],[23.58,0,'outCubic'],[30.62,0],[30.95,-26,'inCubic']], s:[[23.12,0.97],[23.58,1,'outCubic'],[28.9,1],[29.4,1.006,'inOut']] },
  { el:'fbBtn', s:[[26.30,1],[26.46,0.93,'outCubic'],[26.62,1,'outBack']] },
  { el:'b7under', o:[[28.55,0],[28.95,1,'outCubic'],[30.62,1],[30.95,0,'inCubic']], y:[[28.55,42],[29.00,0,'outBack'],[30.62,0],[30.95,-26,'inCubic']] },

  /* B8a prechart (slide from left) */
  { el:'b8anum', o:[[31.05,0],[31.32,1,'outCubic'],[33.12,1],[33.35,0,'inCubic']] },
  { el:'b8acap', o:[[31.05,0],[31.40,1,'outCubic'],[33.12,1],[33.35,0,'inCubic']], x:[[31.05,-90],[31.45,0,'outCubic'],[33.12,0],[33.35,60,'inCubic']] },
  { el:'b8apanel', o:[[31.15,0],[31.50,1,'outCubic'],[33.12,1],[33.35,0,'inCubic']], y:[[31.15,54],[31.55,0,'outCubic']] },

  /* B8b orders (slide from right) */
  { el:'b8bcap', o:[[33.45,0],[33.80,1,'outCubic'],[35.52,1],[35.75,0,'inCubic']], x:[[33.45,90],[33.85,0,'outCubic'],[35.52,0],[35.75,-60,'inCubic']] },
  { el:'b8bpanel', o:[[33.55,0],[33.90,1,'outCubic'],[35.52,1],[35.75,0,'inCubic']], y:[[33.55,54],[33.95,0,'outCubic']] },

  /* B8c any EHR */
  { el:'b8cl1', o:[[35.85,0],[36.18,1,'outCubic'],[37.65,1],[37.95,0,'inCubic']], s:[[35.85,0.88],[36.25,1,'outBack']] },
  { el:'b8cl2', o:[[36.10,0],[36.45,1,'outCubic'],[37.65,1],[37.95,0,'inCubic']], y:[[36.10,40],[36.50,0,'outBack']] },

  /* B9 CTA — no exit; the video ends here */
  { el:'b9pill', o:[[38.10,0],[38.50,1,'outCubic']], y:[[38.10,-70],[38.60,0,'outBack']] },
  { el:'b9word', o:[[38.32,0],[38.72,1,'outCubic']], s:[[38.32,0.955],[38.80,1,'outCubic']] },
  { el:'b9tag',  o:[[38.60,0],[39.00,1,'outCubic']], y:[[38.60,30],[39.05,0,'outCubic']] },
  { el:'b9free', o:[[38.88,0],[39.28,1,'outCubic']], y:[[38.88,26],[39.32,0,'outCubic']] },
  { el:'b9url',  o:[[39.10,0],[39.50,1,'outCubic']], s:[[39.10,0.85],[39.60,1,'outBack'],[40.30,1],[40.65,1.05,'inOut'],[41.05,1,'inOut']] }
];

/* ---------------- cameras ----------------
   kfs entries: [t, scale, px, py, ease] — (px,py) is the stage point
   (0..1) brought to panel center. */
var CAMS = [
  { el:'b3cam', w:960, h:600, dy:40, kfs:[
      [6.0, 1.50, 0.78, 0.30], [8.2, 1.50, 0.78, 0.30, 'linear'],
      [9.2, 2.00, 0.795, 0.33, 'inOut'], [11.0, 2.00, 0.795, 0.33, 'linear'],
      [12.7, 1.06, 0.50, 0.46, 'inOut'] ] },
  { el:'b5cam', w:960, h:600, kfs:[ [16.0, 1.02, 0.5, 0.5], [20.0, 1.10, 0.53, 0.40, 'linear'] ] },
  { el:'b8acam', w:960, h:600, kfs:[ [31.0, 1.22, 0.42, 0.40], [33.4, 1.34, 0.45, 0.42, 'linear'] ] },
  { el:'b8bcam', w:960, h:600, kfs:[ [33.4, 1.22, 0.50, 0.42], [35.8, 1.32, 0.51, 0.44, 'linear'] ] }
];

/* ---------------- scene excerpt seeking ----------------
   sceneStart = scene-local time when the beat begins. */
var SCENES = [
  { beat:'b3',  rootSel:'#b3 .scenes-wrap',  t0:6.0,  t1:13.0, sceneStart:12.6 },
  { beat:'b5',  rootSel:'#b5 .scenes-wrap',  t0:16.0, t1:20.0, sceneStart:1.2 },
  { beat:'b8a', rootSel:'#b8a .scenes-wrap', t0:31.0, t1:33.4, sceneStart:3.4 },
  { beat:'b8b', rootSel:'#b8b .scenes-wrap', t0:33.4, t1:35.8, sceneStart:4.5 }
];
SCENES.forEach(function(sc){
  var root = document.querySelector(sc.rootSel);
  sc.els = [root].concat(Array.prototype.slice.call(root.querySelectorAll('*')));
});

/* ---------------- typing / labels / classes / style tracks ---------------- */
var TYPE_TEXT = 'Make the assessment more concise';
function applySpecials(t) {
  /* input focus ring */
  $('fbInput').className = (t >= 23.95 && t < 30.6) ? 'fb-input focus' : 'fb-input';
  /* placeholder hides as typing begins */
  $('fbPh').style.opacity = t < 24.05 ? 1 : Math.max(0, 1 - (t - 24.05) / 0.15);
  /* deterministic typing 24.2 -> 26.0 */
  var p = Math.min(1, Math.max(0, (t - 24.2) / 1.8));
  var chars = Math.floor(p * TYPE_TEXT.length);
  var typedEl = $('fbTyped');
  var want = TYPE_TEXT.slice(0, chars);
  if (typedEl.textContent !== want) typedEl.textContent = want;
  /* caret: visible 23.95-26.7, deterministic 2.5Hz blink */
  var caretOn = (t >= 23.95 && t <= 26.7) && (Math.floor(t * 2.5) % 2 === 0);
  $('fbCaret').style.opacity = caretOn ? 1 : 0;
  /* button label */
  var btn = $('fbBtn');
  var label = t < 26.5 ? 'Apply feedback' : (t < 28.0 ? 'Rewriting…' : 'Done ✓');
  if (btn.textContent !== label) btn.textContent = label;
  /* assessment swap */
  var wordy = $('fbWordy'), concise = $('fbConcise');
  wordy.style.maxHeight = kv([[26.9,300],[27.75,0,'inOut']], t) + 'px';
  wordy.style.opacity = kv([[26.9,1],[27.55,0,'linear']], t);
  concise.style.maxHeight = kv([[27.35,0],[27.95,110,'inOut']], t) + 'px';
  concise.style.opacity = kv([[27.45,0],[27.95,1,'linear']], t);
  /* shimmer sweep across the changed section */
  var sh = $('fbShimmer');
  sh.style.opacity = kv([[26.8,0],[27.05,1,'linear'],[28.1,1],[28.45,0,'linear']], t);
  sh.style.backgroundPosition = kv([[26.85,140],[28.35,-140,'linear']], t) + '% 0';
}

/* ---------------- core seek ---------------- */
function seek(t) {
  t = Math.max(0, Math.min(DUR, t));
  /* beat visibility */
  for (var i = 0; i < BEATS.length; i++) {
    var b = BEATS[i];
    document.getElementById(b[0]).style.visibility = (t >= b[1] && t < b[2]) ? 'visible' : 'hidden';
  }
  /* element tracks */
  for (var j = 0; j < TRACKS.length; j++) {
    var tr = TRACKS[j];
    var el = tr._el || (tr._el = $(tr.el));
    if (tr.o) el.style.opacity = kv(tr.o, t);
    var parts = '';
    if (tr.x) parts += 'translateX(' + kv(tr.x, t) + 'px) ';
    if (tr.y) parts += 'translateY(' + kv(tr.y, t) + 'px) ';
    if (tr.s) parts += 'scale(' + kv(tr.s, t) + ') ';
    if (tr.r) parts += 'rotate(' + kv(tr.r, t) + 'deg) ';
    if (tr.ry) parts += 'rotateY(' + kv(tr.ry, t) + 'deg) ';
    if (parts) el.style.transform = parts;
  }
  /* cameras */
  for (var k = 0; k < CAMS.length; k++) {
    var c = CAMS[k];
    var el2 = c._el || (c._el = $(c.el));
    var s = kv(c.kfs.map(function(f){ return [f[0], f[1], f[4]]; }), t);
    var px = kv(c.kfs.map(function(f){ return [f[0], f[2], f[4]]; }), t);
    var py = kv(c.kfs.map(function(f){ return [f[0], f[3], f[4]]; }), t);
    var tx = (0.5 - px) * c.w * s;
    var ty = (0.5 - py) * c.h * s + (c.dy || 0);
    el2.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
  }
  /* scene excerpts */
  for (var m = 0; m < SCENES.length; m++) {
    var sc = SCENES[m];
    if (t < sc.t0 - 0.1 || t > sc.t1 + 0.1) continue;
    var local = Math.min(sc.t1 - sc.t0, Math.max(0, t - sc.t0)) + sc.sceneStart;
    var delay = (-local) + 's';
    for (var n = 0; n < sc.els.length; n++) {
      var e3 = sc.els[n];
      e3.style.animationDelay = delay;
      e3.style.animationPlayState = 'paused';
    }
  }
  applySpecials(t);
}

/* ---------------- coordinate measurement (from the site) ---------------- */
function measureTargets() {
  document.querySelectorAll('.stage').forEach(function(stage){
    var sr = stage.getBoundingClientRect();
    if (!sr.width || !sr.height) return;
    stage.querySelectorAll('[data-target]').forEach(function(el){
      var r = el.getBoundingClientRect();
      var px = ((r.left + r.width / 2 - sr.left) / sr.width) * 100;
      var py = ((r.top + r.height / 2 - sr.top) / sr.height) * 100;
      stage.style.setProperty('--' + el.dataset.target + '-x', px.toFixed(3) + '%');
      stage.style.setProperty('--' + el.dataset.target + '-y', py.toFixed(3) + '%');
    });
  });
}

/* ---------------- init ---------------- */
function pauseAllScenes() {
  document.querySelectorAll('.scenes-wrap').forEach(function(root){
    [root].concat(Array.prototype.slice.call(root.querySelectorAll('*'))).forEach(function(el){
      el.style.animationPlayState = 'paused';
    });
  });
}
function fitPreview() {
  if (RENDER) return;
  var sc = Math.min(window.innerWidth / 1080, window.innerHeight / 1350) * 0.98;
  document.getElementById('canvas').style.transform = 'scale(' + sc + ')';
}

var __ready = false;
function boot() {
  if (RENDER) document.body.classList.add('render');
  /* beats must be laid out for measurement — they are (visibility-hidden, not display-none) */
  measureTargets();
  pauseAllScenes();
  seek(FREEZE != null ? FREEZE : 0);
  fitPreview();
  window.addEventListener('resize', function(){ fitPreview(); measureTargets(); });
  __ready = true;
  window.__ready = true;

  if (!RENDER && FREEZE == null) {
    var start = performance.now();
    (function loop(now){
      var t = ((now - start) / 1000) % DUR;
      seek(t);
      requestAnimationFrame(loop);
    })(start);
  }
}

/* render-mode API */
window.__total = DUR;
window.__seek = function(t){ seek(t); };

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function(){ setTimeout(boot, 60); });
} else {
  window.addEventListener('load', function(){ setTimeout(boot, 120); });
}
</script>
